name = "egasa-store"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/", "/admin", "/admin/*", "/api/*", "/products/*", "/shop/*", "/offers/*", "/checkout", "/policies/*", "/media/*", "/demo/*", "/sitemap.xml", "/robots.txt"]

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
MEDIA_ORIGIN = "/media"
FIREBASE_STORAGE_BUCKET = "egasa-87fcd.appspot.com"

[[d1_databases]]
binding = "DB"
database_name = "store"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Egasa no-card edition: encrypted backups only → KV. Images → Firebase Storage.
[[kv_namespaces]]
binding = "BACKUPS"
id = "STORED_IN_EGASA_NOCARD_BACKUPS"

[[durable_objects.bindings]]
name = "PASSWORD_HASHER"
class_name = "PasswordHasher"

[[durable_objects.bindings]]
name = "OPERATIONS"
class_name = "StoreOperations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasswordHasher", "StoreOperations"]
